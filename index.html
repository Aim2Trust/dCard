      <div class="portrait-frame">
        <img
          class="portrait-img"
          src="assets/portrait_lag.webp"
          alt="Lucero Avendaño Gil"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        />
        <!-- Fallback placeholder shown when image is missing -->
        <div class="portrait-placeholder" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="40" cy="30" r="18" fill="url(#pGrad)"/>
            <ellipse cx="40" cy="72" rx="28" ry="20" fill="url(#pGrad)"/>
            <defs>
              <linearGradient id="pGrad" x1="20" y1="10" x2="60" y2="80" gradientUnits="userSpaceOnUse">
                <stop stop-color="#C8A020"/>
                <stop offset="1" stop-color="#7A5010"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>
    </section>

    <!-- Sub-actions (revealed on open) -->
    <div class="fab-actions" id="fab-actions" aria-hidden="true">

      <button class="fab-action" id="action-contact" aria-label="Agregar contacto">
        <span class="fab-action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
        </span>
        <span class="fab-action-label">Agregar contacto</span>
      </button>

      <button class="fab-action" id="action-whatsapp" aria-label="Llamar por WhatsApp">
